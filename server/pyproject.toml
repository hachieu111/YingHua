[project]
name = "yinghua-server"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép chữ Việt/Hán trong chuỗi và comment

[tool.ruff.lint.flake8-bugbear]
# Cách khai báo dependency chuẩn của FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
                          "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Security"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["jieba.*", "pypinyin.*", "edge_tts.*", "fsrs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: cần PostgreSQL (CSDL kiểm thử yinghua_test)"]
