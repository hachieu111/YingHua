[alembic]
script_location = migrations
prepend_sys_path = .
# Tên file: <số>_<mô_tả>.py — tạo bằng: alembic revision --rev-id 0002 -m "mo_ta"
file_template = %%(rev)s_%%(slug)s
# URL CSDL lấy từ server/.env trong migrations/env.py, không ghi ở đây.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
